name: Capture live KabulFit parity reference

on:
  push:
    branches:
      - fix/live-site-pixel-parity
    paths:
      - .github/workflows/capture-live-parity.yml

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install Playwright
        run: |
          npm install playwright@1.55.0 --no-audit --no-fund
          npx playwright install chromium

      - name: Capture desktop and mobile
        run: |
          mkdir -p live-parity
          npx playwright screenshot --browser=chromium --viewport-size="1440,1200" --full-page https://kabulfit.com/ live-parity/desktop.png
          npx playwright screenshot --browser=chromium --viewport-size="390,844" --full-page https://kabulfit.com/ live-parity/mobile.png
          curl -LfsS https://kabulfit.com/ -o live-parity/index.html
          wget --page-requisites --convert-links --adjust-extension --span-hosts --domains=kabulfit.com,www.kabulfit.com --directory-prefix=live-parity/site https://kabulfit.com/ || true
          find live-parity -type f -print | sort > live-parity/manifest.txt

      - name: Upload parity reference
        uses: actions/upload-artifact@v4
        with:
          name: kabulfit-live-parity
          path: live-parity
          retention-days: 1
