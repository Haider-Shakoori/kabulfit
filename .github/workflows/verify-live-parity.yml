name: Verify KabulFit visual parity

on:
  push:
    branches:
      - fix/live-site-pixel-parity
    paths:
      - .github/workflows/verify-live-parity.yml
      - app/**
      - resources/views/**
      - resources/css/**
      - resources/js/**
      - public/images/kabulfit-live/**
      - database/seeders/**

permissions:
  contents: read

concurrency:
  group: kabulfit-parity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, sqlite3, pdo_sqlite
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build Laravel storefront
        run: |
          composer install --no-interaction --prefer-dist
          cp .env.example .env
          php artisan key:generate
          touch database/database.sqlite
          DB_CONNECTION=sqlite DB_DATABASE="$GITHUB_WORKSPACE/database/database.sqlite" php artisan migrate:fresh --seed --force
          npm install --no-audit --no-fund
          npm run build

      - name: Install browser tooling
        run: |
          npm install playwright@1.55.0 pixelmatch@7.1.0 pngjs@7.0.0 --no-audit --no-fund
          npx playwright install chromium

      - name: Start Laravel
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ${{ github.workspace }}/database/database.sqlite
        run: |
          php artisan serve --host=127.0.0.1 --port=8000 > /tmp/kabulfit-server.log 2>&1 &
          echo $! > /tmp/kabulfit-server.pid
          for i in {1..30}; do
            curl -fsS http://127.0.0.1:8000/en >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/kabulfit-server.log
          exit 1

      - name: Capture live and Laravel at matching viewports
        run: |
          mkdir -p parity-output
          cat > capture-parity.mjs <<'NODE'
          import { chromium } from 'playwright';
          import fs from 'node:fs/promises';

          const browser = await chromium.launch({ headless: true });

          async function capture(url, prefix, width, height) {
            const context = await browser.newContext({
              viewport: { width, height },
              deviceScaleFactor: 1,
              colorScheme: 'light',
            });
            const page = await context.newPage();

            // Freeze only the 6-second hero carousel while preserving application timers/data loading.
            await page.addInitScript(() => {
              const nativeSetInterval = window.setInterval.bind(window);
              window.setInterval = (callback, delay, ...args) => {
                if (Number(delay) === 6000) {
                  return 0;
                }

                return nativeSetInterval(callback, delay, ...args);
              };
            });

            await page.goto(url, { waitUntil: 'domcontentloaded', timeout: 120000 });
            await page.waitForTimeout(5000);

            await page.evaluate(async () => {
              const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));
              for (let y = 0; y < document.body.scrollHeight; y += 650) {
                window.scrollTo(0, y);
                await sleep(120);
              }
              window.scrollTo(0, 0);
              await sleep(1000);
            });

            await page.waitForFunction(
              () => [...document.images].every(img => img.complete),
              { timeout: 20000 }
            ).catch(() => {});
            await page.waitForTimeout(500);

            await page.addStyleTag({
              content: '* { animation: none !important; transition: none !important; }'
            });

            const heroButtons = page.locator('main section').first().locator('button');
            const heroButtonCount = await heroButtons.count();
            if (heroButtonCount >= 3) {
              await heroButtons.nth(heroButtonCount - 2).click().catch(() => {});
              await page.waitForTimeout(100);
            }

            const data = await page.evaluate(() => {
              const rect = el => {
                if (!el) return null;
                const r = el.getBoundingClientRect();
                const style = getComputedStyle(el);
                return {
                  x: Math.round(r.x),
                  y: Math.round(r.y),
                  width: Math.round(r.width),
                  height: Math.round(r.height),
                  display: style.display,
                  position: style.position,
                  fontSize: style.fontSize,
                  fontWeight: style.fontWeight,
                  lineHeight: style.lineHeight,
                  color: style.color,
                  backgroundColor: style.backgroundColor,
                };
              };

              return {
                viewport: {
                  innerWidth: window.innerWidth,
                  innerHeight: window.innerHeight,
                  bodyScrollWidth: document.body.scrollWidth,
                  bodyScrollHeight: document.body.scrollHeight,
                  documentScrollWidth: document.documentElement.scrollWidth,
                  documentScrollHeight: document.documentElement.scrollHeight,
                },
                title: document.title,
                bodyClasses: document.body.className,
                header: rect(document.querySelector('header')),
                main: rect(document.querySelector('main')),
                footer: rect(document.querySelector('footer')),
                headings: [...document.querySelectorAll('h1,h2,h3')].map((el, index) => ({
                  index,
                  tag: el.tagName,
                  text: el.textContent.trim().replace(/\s+/g, ' '),
                  rect: rect(el),
                })),
                textBlocks: [...document.querySelectorAll('main p, main h3, main a, main button')].map((el, index) => ({
                  index,
                  tag: el.tagName,
                  text: el.textContent.trim().replace(/\s+/g, ' '),
                  className: el.className?.toString?.() || '',
                  rect: rect(el),
                })),
                images: [...document.images].map((img, index) => ({
                  index,
                  src: img.currentSrc || img.src,
                  alt: img.alt,
                  naturalWidth: img.naturalWidth,
                  naturalHeight: img.naturalHeight,
                  rect: rect(img),
                })),
                sections: [...document.querySelectorAll('main section')].map((section, index) => ({
                  index,
                  className: section.className,
                  rect: rect(section),
                })),
                overflowing: [...document.querySelectorAll('body *')]
                  .map((el, index) => ({ index, tag: el.tagName, className: el.className?.toString?.() || '', rect: rect(el) }))
                  .filter(item => item.rect && (item.rect.x < -0.5 || item.rect.x + item.rect.width > window.innerWidth + 0.5)),
                links: [...document.querySelectorAll('a')].map(a => ({
                  text: a.textContent.trim().replace(/\s+/g, ' '),
                  href: a.href,
                })),
                resources: performance.getEntriesByType('resource').map(entry => entry.name),
              };
            });

            await page.screenshot({ path: 'parity-output/' + prefix + '.png', fullPage: true });
            await fs.writeFile('parity-output/' + prefix + '.html', await page.content());
            await fs.writeFile('parity-output/' + prefix + '.json', JSON.stringify(data, null, 2));
            await context.close();
          }

          await capture('https://kabulfit.com/', 'live-desktop', 1440, 1200);
          await capture('http://127.0.0.1:8000/en', 'laravel-desktop', 1440, 1200);
          await capture('https://kabulfit.com/', 'live-mobile', 390, 844);
          await capture('http://127.0.0.1:8000/en', 'laravel-mobile', 390, 844);

          await browser.close();
          NODE
          node capture-parity.mjs
          cp /tmp/kabulfit-server.log parity-output/server.log

      - name: Capture live compiled bundles
        run: |
          curl --fail --location --retry 3 https://kabulfit.com/assets/index-B5CeItBF.css -o parity-output/live-app.css
          curl --fail --location --retry 3 https://kabulfit.com/assets/index-OsK23eRo.js -o parity-output/live-app.js

      - name: Measure screenshot difference
        run: |
          cat > compare-parity.mjs <<'NODE'
          import fs from 'node:fs';
          import pixelmatch from 'pixelmatch';
          import { PNG } from 'pngjs';

          function fillRect(png, rect) {
            if (!rect) return;

            const x0 = Math.max(0, Math.floor(rect.x));
            const y0 = Math.max(0, Math.floor(rect.y));
            const x1 = Math.min(png.width, Math.ceil(rect.x + rect.width));
            const y1 = Math.min(png.height, Math.ceil(rect.y + rect.height));

            for (let y = y0; y < y1; y++) {
              for (let x = x0; x < x1; x++) {
                const offset = (png.width * y + x) << 2;
                png.data[offset] = 255;
                png.data[offset + 1] = 255;
                png.data[offset + 2] = 255;
                png.data[offset + 3] = 255;
              }
            }
          }

          function compare(aPath, bPath, liveJsonPath, laravelJsonPath, label) {
            const a = PNG.sync.read(fs.readFileSync(aPath));
            const b = PNG.sync.read(fs.readFileSync(bPath));
            const liveData = JSON.parse(fs.readFileSync(liveJsonPath, 'utf8'));
            const laravelData = JSON.parse(fs.readFileSync(laravelJsonPath, 'utf8'));
            const width = Math.max(a.width, b.width);
            const height = Math.max(a.height, b.height);
            const aa = new PNG({ width, height });
            const bb = new PNG({ width, height });
            PNG.bitblt(a, aa, 0, 0, a.width, a.height, 0, 0);
            PNG.bitblt(b, bb, 0, 0, b.width, b.height, 0, 0);

            const rawDiff = new PNG({ width, height });
            const rawMismatched = pixelmatch(aa.data, bb.data, rawDiff.data, width, height, { threshold: 0.1 });
            fs.writeFileSync('parity-output/' + label + '-diff.png', PNG.sync.write(rawDiff));

            // The live Base44/Supabase CDN intermittently leaves lazy images blank in
            // headless full-page screenshots. Mask image rectangles in both renders to
            // measure the UI/chrome/layout itself while retaining the raw visual score.
            const uiA = PNG.sync.read(PNG.sync.write(aa));
            const uiB = PNG.sync.read(PNG.sync.write(bb));
            for (const image of [...(liveData.images || []), ...(laravelData.images || [])]) {
              fillRect(uiA, image.rect);
              fillRect(uiB, image.rect);
            }

            const uiDiff = new PNG({ width, height });
            const uiMismatched = pixelmatch(uiA.data, uiB.data, uiDiff.data, width, height, { threshold: 0.1 });
            fs.writeFileSync('parity-output/' + label + '-ui-diff.png', PNG.sync.write(uiDiff));

            return {
              label,
              reference: { width: a.width, height: a.height },
              laravel: { width: b.width, height: b.height },
              canvas: { width, height },
              mismatchedPixels: rawMismatched,
              mismatchPercent: Number(((rawMismatched / (width * height)) * 100).toFixed(4)),
              uiMismatchedPixels: uiMismatched,
              uiMismatchPercent: Number(((uiMismatched / (width * height)) * 100).toFixed(4)),
              sectionGeometry: {
                reference: (liveData.sections || []).map(section => section.rect),
                laravel: (laravelData.sections || []).map(section => section.rect),
              },
            };
          }

          const report = [
            compare(
              'parity-output/live-desktop.png',
              'parity-output/laravel-desktop.png',
              'parity-output/live-desktop.json',
              'parity-output/laravel-desktop.json',
              'desktop'
            ),
            compare(
              'parity-output/live-mobile.png',
              'parity-output/laravel-mobile.png',
              'parity-output/live-mobile.json',
              'parity-output/laravel-mobile.json',
              'mobile'
            ),
          ];

          fs.writeFileSync('parity-output/parity-report.json', JSON.stringify(report, null, 2));
          console.log(JSON.stringify(report, null, 2));
          NODE
          node compare-parity.mjs

      - uses: actions/upload-artifact@v4
        with:
          name: kabulfit-parity-comparison
          path: parity-output
          retention-days: 3
