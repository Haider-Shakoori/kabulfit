name: Format Batch 7
on:
  push:
    branches: [feat/batch-07-orders-shipping-notifications]
permissions:
  contents: write
jobs:
  pint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/batch-07-orders-shipping-notifications
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: vendor/bin/pint
      - run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app database lang tests routes
          git commit -m "style: format Batch 7 PHP"
          git push origin HEAD:feat/batch-07-orders-shipping-notifications
