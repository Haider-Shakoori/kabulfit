name: Capture live KabulFit reference assets

on:
  push:
    branches:
      - feat/live-site-layout-seeded-assets
    paths:
      - .github/workflows/capture-live-assets.yml

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Capture live reference and public data
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p live-capture/site live-capture/data live-capture/media
          wget --recursive --level=2 --page-requisites --convert-links --adjust-extension --span-hosts             --domains=kabulfit.com,www.kabulfit.com --no-parent --execute robots=off             --directory-prefix=live-capture/site https://kabulfit.com/ || true

          APP_ID="6944d141c2878421ef544832"
          BASE="https://base44.app/api/apps/$APP_ID/entities"
          for entity in Product Category SiteSetting; do
            curl --fail-with-body --silent --show-error -H "X-App-Id: $APP_ID"               "$BASE/$entity?limit=200" -o "live-capture/data/$entity.json" || true
          done

          python - <<'PY'
          import hashlib
          import json
          import pathlib
          import re
          import urllib.request

          root = pathlib.Path("live-capture")
          urls = {
              "https://qtrypzzcjebvfcihiynt.supabase.co/storage/v1/object/public/base44-prod/public/6944d141c2878421ef544832/d653e6253_Favicon.png",
              "https://qtrypzzcjebvfcihiynt.supabase.co/storage/v1/object/public/base44-prod/public/6944d141c2878421ef544832/4ce74c49d_KabulFit_logo_shopify_header.png",
              "https://qtrypzzcjebvfcihiynt.supabase.co/storage/v1/object/public/base44-prod/public/6944d141c2878421ef544832/b6d3c7505_KabulFit_logo_white.png",
              "https://qtrypzzcjebvfcihiynt.supabase.co/storage/v1/object/public/base44-prod/public/6944d141c2878421ef544832/1cce53a01_2.png",
              "https://qtrypzzcjebvfcihiynt.supabase.co/storage/v1/object/public/base44-prod/public/6944d141c2878421ef544832/58f1df170_2.png",
              "https://qtrypzzcjebvfcihiynt.supabase.co/storage/v1/object/public/base44-prod/public/6944d141c2878421ef544832/f065351e6_bn.jpg",
          }

          for p in root.joinpath("data").glob("*.json"):
              try:
                  data = json.loads(p.read_text())
              except Exception:
                  continue

              def walk(value):
                  if isinstance(value, dict):
                      for child in value.values():
                          walk(child)
                  elif isinstance(value, list):
                      for child in value:
                          walk(child)
                  elif isinstance(value, str) and value.startswith("http"):
                      if re.search(r'\.(?:png|jpe?g|webp|svg)(?:$|[?/])', value, re.I):
                          urls.add(value)

              walk(data)

          root.joinpath("all-image-urls.txt").write_text("\n".join(sorted(urls)) + "\n")

          for url in sorted(urls):
              clean = url.split("?", 1)[0].rstrip("/")
              basename = pathlib.PurePosixPath(clean).name or "asset"
              filename = hashlib.sha256(url.encode()).hexdigest()[:12] + "_" + basename
              target = root / "media" / filename
              try:
                  req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
                  with urllib.request.urlopen(req, timeout=30) as response:
                      target.write_bytes(response.read())
              except Exception as exc:
                  print(f"download failed: {url}: {exc}")
          PY

          find live-capture -type f -print | sort > live-capture/manifest.txt
          du -ah live-capture | sort -h > live-capture/sizes.txt

      - name: Upload live reference
        uses: actions/upload-artifact@v4
        with:
          name: kabulfit-live-reference
          path: live-capture
          retention-days: 1
