name: Verify KabulFit visual parity

on:
  push:
    branches:
      - fix/live-site-pixel-parity
    paths:
      - .github/workflows/verify-live-parity.yml

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, sqlite3, pdo_sqlite
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build Laravel storefront
        run: |
          composer install --no-interaction --prefer-dist
          cp .env.example .env
          php artisan key:generate
          touch database/database.sqlite
          DB_CONNECTION=sqlite DB_DATABASE="$GITHUB_WORKSPACE/database/database.sqlite" php artisan migrate:fresh --seed --force
          npm install --no-audit --no-fund
          npm run build

      - name: Install browser
        run: |
          npm install playwright@1.55.0 --no-audit --no-fund
          npx playwright install chromium

      - name: Start Laravel
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ${{ github.workspace }}/database/database.sqlite
        run: |
          php artisan serve --host=127.0.0.1 --port=8000 > /tmp/kabulfit-server.log 2>&1 &
          echo $! > /tmp/kabulfit-server.pid
          for i in {1..30}; do
            curl -fsS http://127.0.0.1:8000/en >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/kabulfit-server.log
          exit 1

      - name: Capture live and Laravel at matching viewports
        run: |
          mkdir -p parity-output
          cat > capture-parity.mjs <<'NODE'
          import { chromium } from 'playwright';

          const browser = await chromium.launch({ headless: true });

          async function capture(url, path, width, height) {
            const context = await browser.newContext({ viewport: { width, height }, deviceScaleFactor: 1 });
            const page = await context.newPage();
            await page.goto(url, { waitUntil: 'networkidle', timeout: 120000 });
            await page.evaluate(async () => {
              const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));
              for (let y = 0; y < document.body.scrollHeight; y += 650) {
                window.scrollTo(0, y);
                await sleep(120);
              }
              window.scrollTo(0, 0);
              await sleep(1000);
            });
            await page.waitForFunction(
              () => [...document.images].every(img => img.complete),
              { timeout: 20000 }
            ).catch(() => {});
            await page.waitForTimeout(1500);
            await page.screenshot({ path, fullPage: true });
            await context.close();
          }

          await capture('https://kabulfit.com/', 'parity-output/live-desktop.png', 1440, 1200);
          await capture('http://127.0.0.1:8000/en', 'parity-output/laravel-desktop.png', 1440, 1200);
          await capture('https://kabulfit.com/', 'parity-output/live-mobile.png', 390, 844);
          await capture('http://127.0.0.1:8000/en', 'parity-output/laravel-mobile.png', 390, 844);

          await browser.close();
          NODE
          node capture-parity.mjs
          cp /tmp/kabulfit-server.log parity-output/server.log

      - uses: actions/upload-artifact@v4
        with:
          name: kabulfit-parity-comparison
          path: parity-output
          retention-days: 1
