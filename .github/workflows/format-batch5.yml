name: Format Batch 5

on:
  push:
    branches: [feat/batch-05-commerce-stripe]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/batch-05-commerce-stripe
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: vendor/bin/pint
      - name: Commit formatting
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app database routes config lang
          git commit -m "style: format Batch 5 PHP"
          git push origin HEAD:feat/batch-05-commerce-stripe
