name: Import live KabulFit assets

on:
  push:
    branches:
      - feat/live-site-layout-seeded-assets
    paths:
      - .github/workflows/capture-live-assets.yml

permissions:
  contents: write

jobs:
  import-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/live-site-layout-seeded-assets

      - name: Import verified live assets and catalog metadata
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/images/kabulfit-live/catalog docs/live-reference /tmp/kabulfit-data

          APP_ID="6944d141c2878421ef544832"
          BASE="https://base44.app/api/apps/$APP_ID/entities"
          for entity in Product Category SiteSetting; do
            curl --connect-timeout 10 --max-time 30 --fail-with-body --silent --show-error               -H "X-App-Id: $APP_ID" "$BASE/$entity?limit=200"               -o "/tmp/kabulfit-data/$entity.json" || printf '[]' > "/tmp/kabulfit-data/$entity.json"
          done

          python - <<'PY'
          import concurrent.futures
          import hashlib
          import json
          import pathlib
          import re
          import urllib.request

          root = pathlib.Path(".")
          target = root / "public/images/kabulfit-live"
          catalog = target / "catalog"
          docs = root / "docs/live-reference"
          target.mkdir(parents=True, exist_ok=True)
          catalog.mkdir(parents=True, exist_ok=True)
          docs.mkdir(parents=True, exist_ok=True)

          verified = {
              "favicon.png": "https://qtrypzzcjebvfcihiynt.supabase.co/storage/v1/object/public/base44-prod/public/6944d141c2878421ef544832/d653e6253_Favicon.png",
              "logo-header.png": "https://qtrypzzcjebvfcihiynt.supabase.co/storage/v1/object/public/base44-prod/public/6944d141c2878421ef544832/4ce74c49d_KabulFit_logo_shopify_header.png",
              "logo-footer.png": "https://qtrypzzcjebvfcihiynt.supabase.co/storage/v1/object/public/base44-prod/public/6944d141c2878421ef544832/b6d3c7505_KabulFit_logo_white.png",
              "hero-heritage.png": "https://qtrypzzcjebvfcihiynt.supabase.co/storage/v1/object/public/base44-prod/public/6944d141c2878421ef544832/1cce53a01_2.png",
              "measurement-guide.png": "https://qtrypzzcjebvfcihiynt.supabase.co/storage/v1/object/public/base44-prod/public/6944d141c2878421ef544832/58f1df170_2.png",
              "craftsmanship.jpg": "https://qtrypzzcjebvfcihiynt.supabase.co/storage/v1/object/public/base44-prod/public/6944d141c2878421ef544832/f065351e6_bn.jpg",
          }

          def download(pair):
              name, url = pair
              req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
              with urllib.request.urlopen(req, timeout=20) as response:
                  data = response.read()
              (target / name).write_bytes(data)
              return {"file": f"public/images/kabulfit-live/{name}", "url": url, "bytes": len(data)}

          verified_results = []
          with concurrent.futures.ThreadPoolExecutor(max_workers=6) as pool:
              for result in pool.map(download, verified.items()):
                  verified_results.append(result)

          entity_manifest = {}
          image_candidates = []

          for entity in ("Product", "Category", "SiteSetting"):
              path = pathlib.Path("/tmp/kabulfit-data") / f"{entity}.json"
              try:
                  payload = json.loads(path.read_text())
              except Exception:
                  payload = []

              records = payload.get("data", payload) if isinstance(payload, dict) else payload
              if not isinstance(records, list):
                  records = []

              entity_manifest[entity] = records

              def walk(value, field_path, record):
                  if isinstance(value, dict):
                      for key, child in value.items():
                          walk(child, field_path + [str(key)], record)
                  elif isinstance(value, list):
                      for idx, child in enumerate(value):
                          walk(child, field_path + [str(idx)], record)
                  elif isinstance(value, str) and value.startswith("http"):
                      if re.search(r'\.(?:png|jpe?g|webp|svg)(?:$|[?/])', value, re.I):
                          image_candidates.append({
                              "entity": entity,
                              "record_id": record.get("id") if isinstance(record, dict) else None,
                              "record_name": (
                                  record.get("name")
                                  or record.get("title")
                                  or record.get("sku")
                                  if isinstance(record, dict) else None
                              ),
                              "field": ".".join(field_path),
                              "url": value,
                          })

              for record in records:
                  walk(record, [], record)

          unique = {}
          for item in image_candidates:
              unique.setdefault(item["url"], item)

          def download_candidate(item):
              url = item["url"]
              clean = url.split("?", 1)[0].rstrip("/")
              suffix = pathlib.PurePosixPath(clean).suffix.lower()
              if suffix not in {".png", ".jpg", ".jpeg", ".webp", ".svg"}:
                  suffix = ".img"
              digest = hashlib.sha256(url.encode()).hexdigest()[:12]
              entity = re.sub(r'[^a-z0-9]+', '-', item["entity"].lower()).strip("-")
              filename = f"{entity}-{digest}{suffix}"
              destination = catalog / filename
              req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
              try:
                  with urllib.request.urlopen(req, timeout=15) as response:
                      data = response.read()
                  destination.write_bytes(data)
                  return {**item, "local_path": f"images/kabulfit-live/catalog/{filename}", "bytes": len(data)}
              except Exception as exc:
                  return {**item, "error": str(exc)}

          catalog_results = []
          with concurrent.futures.ThreadPoolExecutor(max_workers=12) as pool:
              for result in pool.map(download_candidate, unique.values()):
                  catalog_results.append(result)

          manifest = {
              "source": "https://kabulfit.com/",
              "verified_assets": sorted(verified_results, key=lambda x: x["file"]),
              "catalog_images": catalog_results,
              "entities": entity_manifest,
          }
          (docs / "asset-manifest.json").write_text(json.dumps(manifest, ensure_ascii=False, indent=2))
          PY

      - name: Commit imported local assets
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/images/kabulfit-live docs/live-reference/asset-manifest.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "feat: import live KabulFit visual assets"
          git push origin HEAD:feat/live-site-layout-seeded-assets
